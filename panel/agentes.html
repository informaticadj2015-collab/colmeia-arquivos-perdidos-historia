<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colmeia — Agentes</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0f14;color:#e8edf3;font-family:Arial,Helvetica,sans-serif}
header{padding:22px 28px;border-bottom:1px solid #202833;background:#10151c}
h1{margin:0;font-size:24px}
.sub{margin-top:6px;color:#8e9aaa;font-size:13px}
main{padding:28px;max-width:1200px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.back{border:1px solid #303b48;background:#151c24;color:#dce4ed;padding:9px 14px;border-radius:6px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.card{background:#111821;border:1px solid #27313d;border-radius:10px;padding:20px}
.label{font-size:11px;color:#7f8b9a;text-transform:uppercase;letter-spacing:.08em}
.value{margin-top:7px;font-size:17px}
.online{color:#65d391}
.meta{margin-top:18px;padding-top:15px;border-top:1px solid #252e39}
.row{display:flex;justify-content:space-between;gap:20px;padding:8px 0;border-bottom:1px solid #1d252f;font-size:13px}
.row:last-child{border-bottom:0}
.row span:first-child{color:#8793a1}
.cap{margin-top:15px;color:#9da9b7;font-size:12px;line-height:1.7}
.empty,.error{padding:25px;border:1px solid #303b48;background:#111821;border-radius:10px;color:#aab4c0}
</style>
</head>
<body>
<header>
  <h1>COLMEIA — AGENTES</h1>
  <div class="sub">Agentes efetivamente registrados no Core</div>
</header>

<main>
  <div class="top">
    <div>
      <div class="label">Agentes registrados</div>
      <div class="value" id="count">Consultando...</div>
    </div>
    <button class="back" onclick="window.location.href='/panel'">← Voltar à Colmeia</button>
  </div>

  <div id="content"></div>
</main>

<script>
async function carregar() {
  const content = document.getElementById("content");
  const count = document.getElementById("count");

  try {
    const r = await fetch("/panel/agentes", {cache:"no-store"});
    const data = await r.json();

    if (data.status !== "OK") {
      throw new Error(data.error || "Falha ao consultar Agentes");
    }

    count.textContent = data.count;

    if (!data.agentes.length) {
      content.innerHTML = '<div class="empty">Nenhum agente registrado nesta Colmeia.</div>';
      return;
    }

    content.innerHTML = '<div class="grid">' + data.agentes.map(a => `
      <section class="card">
        <div class="label">Agente</div>
        <div class="value">${a.name}</div>

        <div class="meta">
          <div class="row"><span>Papel</span><span>${a.role}</span></div>
          <div class="row"><span>Ciclo de vida</span><span>${a.lifecycle}</span></div>
          <div class="row"><span>Status</span><span class="${a.status === "ONLINE" ? "online" : ""}">${a.status}</span></div>
          <div class="row"><span>Worker</span><span>${a.metadata?.worker_id ?? "—"}</span></div>
          <div class="row"><span>Máquina</span><span>${a.metadata?.machine ?? "—"}</span></div>
          <div class="row"><span>Hostname</span><span>${a.metadata?.hostname ?? "—"}</span></div>
          <div class="row"><span>IP</span><span>${a.metadata?.ip ?? "—"}</span></div>
          <div class="row"><span>Porta</span><span>${a.metadata?.port ?? "—"}</span></div>
          <div class="row"><span>Gerenciado por</span><span>${a.metadata?.managed_by ?? "—"}</span></div>
          <div class="row"><span>Último sinal</span><span>${a.last_seen_at ?? "—"}</span></div>
        </div>

        <div class="cap">
          <strong>Capacidades reais:</strong><br>
          ${Object.entries(a.capabilities || {}).map(([k,v]) => `${k}: ${v}`).join("<br>") || "Nenhuma registrada"}
        </div>
      </section>
    `).join("") + '</div>';

  } catch (e) {
    count.textContent = "ERRO";
    content.innerHTML = '<div class="error">Falha real ao consultar o backend: ' + e.message + '</div>';
  }
}

carregar();
setInterval(carregar, 5000);
</script>
</body>
</html>

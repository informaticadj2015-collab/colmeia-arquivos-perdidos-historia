<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>COLMEIA — Missões</title>
<style>
:root{--bg:#080b10;--p:#0d1219;--p2:#111821;--line:#202a35;--text:#edf1f5;--muted:#7d8997;--gold:#d6a83d;--green:#36d27f;--red:#ef6262;--blue:#55a8ff;--orange:#efa34a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif}
body{padding:25px}
.wrap{max-width:1500px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px}
.kicker{color:var(--gold);font-size:9px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
h1{margin:5px 0 0;font-size:25px}
.desc{margin-top:5px;color:var(--muted);font-size:11px}
.back{border:1px solid var(--line);background:var(--p);color:var(--text);padding:10px 14px;border-radius:6px;text-decoration:none;font-size:11px}
.back:hover{border-color:var(--gold)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{background:var(--p);border:1px solid var(--line);border-radius:8px;padding:17px}
.label{color:#6d7987;font-size:8px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.value{margin-top:8px;font-size:25px;font-weight:750}
.panel{margin-top:12px;background:var(--p);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.panel-head{height:52px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.panel-title{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.status{color:#647080;font-size:9px}
.row{padding:14px 16px;border-bottom:1px solid #181f28}
.row:last-child{border-bottom:0}
.row-main{display:flex;justify-content:space-between;gap:15px}
.title{font-size:12px;font-weight:700}
.id{margin-top:5px;color:#687482;font-size:9px}
.meta{margin-top:7px;color:#687482;font-size:9px}
.state{font-size:8px;font-weight:800;letter-spacing:.06em;white-space:nowrap}
.ok{color:var(--green)}.wait{color:var(--orange)}.fail{color:var(--red)}.run{color:var(--blue)}
.empty{padding:30px;text-align:center;color:#647080;font-size:10px}
.new-research{margin-top:12px}
.new-desc{margin-top:4px;color:var(--muted);font-size:9px}
.form{padding:18px 16px}
.form label{display:block;margin-bottom:14px}
.form label span{display:block;margin-bottom:6px;color:#8b97a5;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.form input,.form textarea{width:100%;border:1px solid var(--line);border-radius:6px;background:#090e14;color:var(--text);padding:11px 12px;font:inherit;font-size:11px;outline:none}
.form input:focus,.form textarea:focus{border-color:var(--gold)}
.form textarea{resize:vertical;min-height:110px}
.form-actions{display:flex;align-items:center;gap:12px}
.form-actions button{border:1px solid var(--gold);background:#17140d;color:var(--gold);padding:10px 16px;border-radius:6px;font-size:9px;font-weight:900;letter-spacing:.08em;cursor:pointer}
.form-actions button:hover{background:#211b0d}
.form-actions button:disabled{opacity:.5;cursor:not-allowed}
.form-status{color:#7d8997;font-size:9px}
.authorize-btn{margin-top:8px;border:1px solid var(--gold);background:#17140d;color:var(--gold);padding:7px 10px;border-radius:5px;font-size:8px;font-weight:900;letter-spacing:.08em;cursor:pointer}
.authorize-btn:hover{background:#211b0d}
.authorize-btn:disabled{opacity:.5;cursor:not-allowed}
@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;gap:15px}.row-main{display:block}.state{margin-top:8px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top">
<div>
<div class="kicker">CENTRAL DE OPERAÇÕES</div>
<h1>Missões</h1>
<div class="desc">Registro operacional real da Colmeia.</div>
</div>
<a class="back" href="/panel">← Central de Comando</a>
</div>

<div class="cards">
<div class="card"><div class="label">Total</div><div id="total" class="value">—</div></div>
<div class="card"><div class="label">Autorizadas</div><div id="authorized" class="value">—</div></div>
<div class="card"><div class="label">Em execução</div><div id="running" class="value">—</div></div>
<div class="card"><div class="label">Concluídas</div><div id="completed" class="value">—</div></div>
</div>

<div class="panel new-research">
<div class="panel-head">
<div>
<div class="panel-title">Nova pesquisa</div>
<div class="new-desc">Criar uma missão real para a Colmeia.</div>
</div>
<div class="status">MESTRE / APICULTOR</div>
</div>

<div class="form">
<label>
<span>Assunto da pesquisa</span>
<input id="researchSubject" type="text" maxlength="200" placeholder="Ex.: prédios históricos de Rio Grande">
</label>

<label>
<span>Objetivo e critérios</span>
<textarea id="researchObjective" rows="5" maxlength="5000" placeholder="Descreva exatamente o que a Batedora deve pesquisar e quais critérios devem ser respeitados."></textarea>
</label>

<div class="form-actions">
<button id="createResearch" type="button">CRIAR PESQUISA</button>
<div id="createStatus" class="form-status"></div>
</div>
</div>
</div>

<div class="panel">
<div class="panel-head">
<div class="panel-title">Registro de missões</div>
<div id="status" class="status">Consultando API...</div>
</div>
<div id="list"><div class="empty">Carregando missões reais...</div></div>
</div>
</div>

<script>
const esc=v=>String(v??"—").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
const stateText=s=>String(s||"—").replaceAll("_"," ");
const stateClass=s=>{
 s=String(s||"").toUpperCase();
 if(s==="CONCLUIDA")return"ok";
 if(s==="AUTORIZADA"||s==="DORMINDO")return"wait";
 if(s==="FALHOU"||s==="OFFLINE")return"fail";
 if(s==="EM_EXECUCAO")return"run";
 return"";
};

async function authorizeMission(event,button){
 event.preventDefault();
 event.stopPropagation();

 const id=button.dataset.id;
 if(!id)return;

 if(!confirm("Autorizar esta missão para execução real pela Colmeia?"))return;

 button.disabled=true;
 button.textContent="AUTORIZANDO...";

 try{
   const r=await fetch("/mission/authorize/"+encodeURIComponent(id),{
     method:"POST"
   });

   const data=await r.json();

   if(!r.ok){
     throw Error(data.detail||data.error||("HTTP "+r.status));
   }

   await load();
 }catch(err){
   console.error(err);
   button.disabled=false;
   button.textContent="AUTORIZAR";
   alert("Não foi possível autorizar a missão: "+err.message);
 }
}


async function dispatchMission(event,button){
 event.preventDefault();
 event.stopPropagation();

 const id=button.dataset.id;
 if(!id)return;

 if(!confirm("Enviar esta missão autorizada para a Batedora no Worker i7?"))return;

 button.disabled=true;
 button.textContent="DESPACHANDO...";

 try{
   const r=await fetch("/mission/dispatch/"+encodeURIComponent(id),{
     method:"POST"
   });

   const data=await r.json();

   if(!r.ok || data.status!=="DISPATCHED"){
     throw Error(data.error||data.detail||data.status||("HTTP "+r.status));
   }

   await load();
 }catch(err){
   console.error(err);
   button.disabled=false;
   button.textContent="DESPACHAR";
   alert("Não foi possível despachar a missão: "+err.message);
 }
}

async function load(){
 try{
   const r=await fetch("/panel/missions",{cache:"no-store"});
   if(!r.ok)throw Error("HTTP "+r.status);
   const data=await r.json();
   const missions=Array.isArray(data)?data:(data.missions||data.items||[]);

   const count=s=>missions.filter(x=>String(x.state||x.status||"").toUpperCase()===s).length;
   document.getElementById("total").textContent=data.total??data.count??missions.length;
   document.getElementById("authorized").textContent=count("AUTORIZADA");
   document.getElementById("running").textContent=count("EM_EXECUCAO");
   document.getElementById("completed").textContent=count("CONCLUIDA");

   document.getElementById("list").innerHTML=missions.length
   ?missions.map(x=>`
     <a class="row" href="/panel/mission-detail-ui?id=${encodeURIComponent(x.id||x.mission_id||"")}">
       <div class="row-main">
         <div>
           <div class="title">${esc(x.title||x.name||"Missão sem título")}</div>
           <div class="id">${esc(x.id||x.mission_id||"")}</div>
           <div class="meta">
             Origem: ${esc(x.origin||"—")} · Destino: ${esc(x.destination||"—")} ·
             Criada: ${esc(x.created_at||"—")}
           </div>
         </div>
         <div>
  <div class="state ${stateClass(x.state||x.status)}">${esc(stateText(x.state||x.status))}</div>
  ${String(x.state||x.status||"").toUpperCase()==="CRIADA"
    ? `<button class="authorize-btn" data-id="${esc(x.id||x.mission_id||"")}" onclick="event.preventDefault();event.stopPropagation();authorizeMission(event,this)">AUTORIZAR</button>`
    : String(x.state||x.status||"").toUpperCase()==="AUTORIZADA"
      ? `<button class="authorize-btn" data-id="${esc(x.id||x.mission_id||"")}" onclick="event.preventDefault();event.stopPropagation();dispatchMission(event,this)">DESPACHAR</button>`
      : ""}
</div>
       </div>
     </a>`).join("")
   :'<div class="empty">Nenhuma missão registrada.</div>';

   document.getElementById("status").textContent="Atualizado às "+new Date().toLocaleTimeString("pt-BR");
 }catch(err){
   console.error(err);
   document.getElementById("status").textContent="Falha de comunicação com a API";
   document.getElementById("list").innerHTML='<div class="empty">Não foi possível consultar as missões.</div>';
 }
}
document.getElementById("createResearch").addEventListener("click", async ()=>{
 const subject=document.getElementById("researchSubject").value.trim();
 const objective=document.getElementById("researchObjective").value.trim();
 const status=document.getElementById("createStatus");
 const button=document.getElementById("createResearch");

 if(!subject || !objective){
   status.textContent="Informe o assunto e o objetivo da pesquisa.";
   return;
 }

 button.disabled=true;
 status.textContent="Criando missão real...";

 try{
   const r=await fetch("/mission/create",{
     method:"POST",
     headers:{"Content-Type":"application/json"},
     body:JSON.stringify({
       title:"PESQUISA — "+subject,
       objective:objective,
       query:subject
     })
   });

   const data=await r.json();

   if(!r.ok){
     throw Error(data.detail||data.error||("HTTP "+r.status));
   }

   status.textContent="MISSÃO CRIADA — aguardando autorização do Mestre/Apicultor.";
   document.getElementById("researchSubject").value="";
   document.getElementById("researchObjective").value="";
   await load();
 }catch(err){
   console.error(err);
   status.textContent="Falha ao criar missão: "+err.message;
 }finally{
   button.disabled=false;
 }
});

load();
setInterval(load,5000);
</script>
</body>
</html>
